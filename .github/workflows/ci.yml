
name: C++ Configuration Parser CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.build_type }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCONFIG_PARSER_BUILD_TESTS=ON
          -DCONFIG_PARSER_BUILD_EXAMPLES=ON
          -DCONFIG_PARSER_BUILD_BENCHMARKS=ON

      - name: Build project
        run: cmake --build build --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
